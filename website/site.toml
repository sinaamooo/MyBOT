# ─────────────────────────────────────────────────────────────
#  اطلاعات سایت نامبیکس
#  هر چه این‌جا بنویسید در همه‌ی صفحه‌ها قرار می‌گیرد.
#  بعد از ویرایش اجرا کنید:  python3 build.py
#  موارد خالی هنگام ساخت اعلام می‌شوند و روی صفحه با {{...}} دیده می‌شوند.
# ─────────────────────────────────────────────────────────────

[business]
brand_fa = "نامبیکس"
brand_en = "Numbix"
domain = ""          # فقط دامنه، مثل numbix.ir
bot_username = ""    # نام کاربری ربات بدون @ (فقط در متن قوانین و حریم خصوصی می‌آید؛ هیچ لینک یا دکمه‌ای به تلگرام ساخته نمی‌شود)
owner_name = ""      # نام صاحب کسب‌وکار (همان متقاضی اینماد)
mobile = ""          # مثل 09121234567
landline = ""        # اختیاری: تلفن ثابت (اگر خالی باشد نمایش داده نمی‌شود)
email = ""           # مثل info@numbix.ir
address = ""         # نشانی کامل، دقیقاً مطابق نشانی ثبت‌شده در اینماد
postal_code = ""     # کد پستی ۱۰ رقمی
hours = "شنبه تا پنجشنبه، ساعت ۹ تا ۱۸"
services_line = ""   # یک جمله درباره‌ی خدمات، مثل: فروش شماره‌ی مجازی برای تأیید حساب پیام‌رسان‌ها
year = "۱۴۰۵"
legal_updated = "۱۳ مهر ۱۴۰۵"   # تاریخ به‌روزرسانی قوانین و حریم خصوصی

[enamad]
# کد تأیید دامنه (فقط عدد یا متنی که اینماد به‌عنوان content متا تگ می‌دهد)
meta_code = ""
# کد نماد اعتماد که پنل اینماد می‌دهد؛ کل تگ را بین سه علامت ''' بچسبانید
seal_html = '''
'''

# ─── خدمات و قیمت‌ها ─────────────────────────────────────────
# برای هر خدمت یک بلوک [[services]] بنویسید. قیمت به تومان و فقط عدد.
# category اختیاری است؛ اگر بیش از یک دسته داشته باشید، تب دسته‌بندی ساخته می‌شود.
# available = false یعنی «ناموجود» (دکمه‌ی سفارش غیرفعال می‌شود).
# icon اختیاری: smartphone ، message-circle ، package ، sparkles ، zap ، wallet

[[services]]
name = ""
price = ""
category = ""
description = ""
icon = "smartphone"

[[services]]
name = ""
price = ""
category = ""
description = ""
icon = "message-circle"

[[services]]
name = ""
price = ""
category = ""
description = ""
icon = "sparkles"

[[services]]
name = ""
price = ""
category = ""
description = ""
icon = "wallet"

# ─── وضعیت سرویس‌ها (در پنل و هدر) ───────────────────────────
# tone یکی از: ok (فعال) ، warn (اختلال جزئی) ، err (قطع)
# اگر سرویسی قطع شد این‌جا را عوض کنید و دوباره build بگیرید.

[[status]]
label = "سفارش آنلاین"
value = "فعال"
tone = "ok"
note = "ثبت سفارش و تحویل خودکار در دسترس است"

[[status]]
label = "پرداخت"
value = "فعال"
tone = "ok"
note = "پرداخت فقط از مسیر رسمی نامبیکس انجام می‌شود"

[[status]]
label = "پشتیبانی"
value = "ساعات کاری"
tone = "ok"
note = "شنبه تا پنجشنبه، ساعت ۹ تا ۱۸"

# ─── اعلان‌ها (زنگوله‌ی هدر و پنل) ────────────────────────────
# tone یکی از: info ، success ، warning ، error

[[notices]]
title = "قوانین و شرایط بازگشت وجه به‌روز شد"
text = "شرایط لغو سفارش و بازگشت وجه را در صفحه‌ی قوانین بخوانید."
date = "۱۳ مهر ۱۴۰۵"
tone = "info"

[[notices]]
title = "پرداخت فقط از مسیر رسمی نامبیکس"
text = "نامبیکس هیچ‌گاه از طریق پیام خصوصی درخواست واریز وجه نمی‌کند."
date = "۱۳ مهر ۱۴۰۵"
tone = "warning"
