# ─────────────────────────────────────────────────────────────
#  اطلاعات سایت نامبیکس
#  هر چه این‌جا بنویسید در همه‌ی صفحه‌ها قرار می‌گیرد.
#  بعد از ویرایش اجرا کنید:  python3 build.py
#  موارد خالی هنگام ساخت اعلام می‌شوند و روی صفحه با {{...}} دیده می‌شوند.
# ─────────────────────────────────────────────────────────────

[business]
brand_fa = "نامبیکس"
brand_en = "Numbix"
domain = "numbix.shop"          # فقط دامنه، مثل numbix.ir
bot_username = ""    # اختیاری: نام کاربری ربات بدون @ (فقط در متن قوانین می‌آید؛ هیچ لینک یا دکمه‌ای به تلگرام ساخته نمی‌شود)
owner_name = "سینا عزتی"      # نام صاحب کسب‌وکار (همان متقاضی اینماد)
mobile = "09302183925"          # مثل 09121234567
landline = ""        # اختیاری: تلفن ثابت (اگر خالی باشد نمایش داده نمی‌شود)
email = "niktowhale@gmail.com"           # مثل info@numbix.ir
address = "آذربایجان شرقی، شهرستان چارایماق، روستای خواجه شاهی"         # نشانی کامل، دقیقاً مطابق نشانی ثبت‌شده در اینماد
postal_code = ""     # اختیاری: کد پستی ۱۰ رقمی (اگر خالی باشد نمایش داده نمی‌شود)
hours = "شنبه تا پنجشنبه، ساعت ۹ تا ۱۸"
services_line = "فروش شماره مجازی و خدمات تلگرام و اینستاگرام"   # یک جمله درباره‌ی خدمات، مثل: فروش شماره‌ی مجازی برای تأیید حساب پیام‌رسان‌ها
slogan = "اعتماد شما اعتبار ماست"   # اختیاری: شعار کوتاه زیر لوگوی پایین صفحه
year = "۱۴۰۵"
legal_updated = "۱۶ مهر ۱۴۰۵"   # تاریخ به‌روزرسانی قوانین و حریم خصوصی

[enamad]
# کد تأیید دامنه (فقط عدد یا متنی که اینماد به‌عنوان content متا تگ می‌دهد)
meta_code = ""
# کد نماد اعتماد که پنل اینماد می‌دهد؛ کل تگ را بین سه علامت ''' بچسبانید
seal_html = '''
'''

[server]
webroot = ""          # پوشه‌ی سایت روی سرور؛ خالی = /www/wwwroot/<domain>
admin_path = "/admin" # نشانی پنل مدیر؛ برای امنیت بیشتر یک مسیر غیرقابل‌حدس بگذارید، مثل /panel-x7k2
admin_port = 8001     # پورت داخلی پنل مدیر (فقط روی 127.0.0.1)

# ─── خدمات و قیمت‌ها ─────────────────────────────────────────
# برای هر خدمت یک بلوک [[services]] بنویسید. قیمت به تومان و فقط عدد.
# category اختیاری است؛ اگر بیش از یک دسته داشته باشید، تب دسته‌بندی ساخته می‌شود.
# available = false یعنی «ناموجود» (دکمه‌ی سفارش غیرفعال می‌شود).
# icon اختیاری: smartphone ، message-circle ، package ، sparkles ، zap ، wallet

[[services]]
name = "شماره مجازی"
price = "قیمت روز"   # فقط عدد به تومان، مثل 45000
category = ""
description = "شماره‌ی مجازی کشورهای مختلف برای ساخت و تأیید حساب در پیام‌رسان‌ها و شبکه‌های اجتماعی، با دریافت خودکار کد."
icon = "smartphone"

[[services]]
name = "خدمات تلگرام"
price = "قیمت روز"   # فقط عدد به تومان، مثل 45000
category = ""
description = "پریمیوم تلگرام، ممبر کانال و گروه، بازدید و ری‌اکشن پست‌ها."
icon = "message-circle"

[[services]]
name = "خدمات اینستاگرام"
price = "قیمت روز"   # فقط عدد به تومان، مثل 45000
category = ""
description = "فالوور، لایک، بازدید پست و ریلز و بازدید استوری."
icon = "sparkles"

# ─── وضعیت سرویس‌ها (در پنل و هدر) ───────────────────────────
# tone یکی از: ok (فعال) ، warn (اختلال جزئی) ، err (قطع)
# اگر سرویسی قطع شد این‌جا را عوض کنید و دوباره build بگیرید.

[[status]]
label = "سفارش آنلاین"
value = "فعال"
tone = "ok"
note = "ثبت سفارش و تحویل خودکار در دسترس است"

[[status]]
label = "پرداخت"
value = "فعال"
tone = "ok"
note = "پرداخت فقط از مسیر رسمی نامبیکس انجام می‌شود"

[[status]]
label = "پشتیبانی"
value = "ساعات کاری"
tone = "ok"
note = "شنبه تا پنجشنبه، ساعت ۹ تا ۱۸"

# ─── اعلان‌ها (زنگوله‌ی هدر و پنل) ────────────────────────────
# tone یکی از: info ، success ، warning ، error

[[notices]]
title = "قوانین و شرایط بازگشت وجه به‌روز شد"
text = "شرایط لغو سفارش و بازگشت وجه را در صفحه‌ی قوانین بخوانید."
date = "۱۳ مهر ۱۴۰۵"
tone = "info"

[[notices]]
title = "پرداخت فقط از مسیر رسمی نامبیکس"
text = "نامبیکس هیچ‌گاه از طریق پیام خصوصی درخواست واریز وجه نمی‌کند."
date = "۱۳ مهر ۱۴۰۵"
tone = "warning"
