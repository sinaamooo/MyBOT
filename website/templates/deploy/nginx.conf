# ═════════════════════════════════════════════════════════════════════
#  nginx config for {{ site.domain }} — generated by build.py, do not edit by hand
#
#  aaPanel: Website → {{ site.domain }} → Conf
#    PART 1 → at the very top of the file, above "server {"
#    PART 2 → inside "server { }", after aaPanel's ssl_* lines.
#             Remove aaPanel's own "location /", "error_page" and
#             "location ~ .*\.(js|css)$" blocks if they exist.
# ═════════════════════════════════════════════════════════════════════

{% macro admin_proxy() %}
        proxy_pass http://127.0.0.1:{{ site.admin_port }};
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx already sends these for the whole site; drop the app's duplicates
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
{%- endmacro %}
# ── PART 1 ───────────────────────────────────────────────────────────
limit_req_zone  $binary_remote_addr zone=nx_site:10m  rate=40r/s;
limit_req_zone  $binary_remote_addr zone=nx_admin:10m rate=8r/s;
limit_req_zone  $binary_remote_addr zone=nx_login:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=nx_conn:10m;

# ── PART 2 ───────────────────────────────────────────────────────────
    root {{ site.webroot }};
    index index.html;
    server_tokens off;
    charset utf-8;
    autoindex off;

    # Small, quick requests only: slow-loris and oversized bodies are cut off
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    large_client_header_buffers 4 8k;
    keepalive_timeout 20s;
    send_timeout 15s;

    # Flood protection per visitor IP (generous enough for shared mobile IPs)
    limit_req zone=nx_site burst=80 nodelay;
    limit_conn nx_conn 40;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "{{ csp_header }}" always;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Hidden and server-side files are never served
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(?:py|pyc|toml|sql|sqlite3?|db|bak|old|orig|swp|env|log|ini|conf|sh|key|pem)$ { return 404; }

    # Hashed bundles never change: cache for a year
    location /assets/ {
        limit_except GET HEAD { deny all; }
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location / {
        limit_except GET HEAD { deny all; }
        expires -1;
        try_files $uri $uri/ =404;
    }

    # Admin panel (gunicorn on 127.0.0.1:{{ site.admin_port }})
    location {{ site.admin_path }}/ {
        # Strongly recommended: only your own IP may open the admin panel
        # allow 1.2.3.4;
        # deny all;
        limit_req zone=nx_admin burst=30 nodelay;
{{ admin_proxy() }}
        proxy_read_timeout 60s;
    }

    location = {{ site.admin_path }}/login {
        # allow 1.2.3.4;
        # deny all;
        limit_req zone=nx_login burst=10 nodelay;
{{ admin_proxy() }}
    }
