{% import "macros/ui.html" as ui %}
<dialog class="modal modal--sheet" id="more-sheet" aria-label="صفحه‌های بیشتر">
  <div class="modal__box">
    <span class="sheet__handle" aria-hidden="true"></span>
    <ul class="menu menu--sheet">
      {% for slug in ["about", "terms", "privacy"] %}
      {% set item = pages[slug] %}
      <li><a class="menu__item"{% if item.slug == page.slug %} aria-current="page"{% endif %} href="{{ item.url }}">{{ icon(item.icon) }}{{ item.nav }}</a></li>
      {% endfor %}
    </ul>
    <div class="menu__sep"></div>
    {{ ui.perf_switch() }}
  </div>
</dialog>

<div class="toasts" data-toasts aria-live="polite"></div>
<template id="toast-template">
  <div class="toast" role="status">
    <span class="toast__icon">{{ icon("circle-check", "i--success") }}{{ icon("circle-x", "i--error") }}{{ icon("triangle-alert", "i--warning") }}{{ icon("info", "i--info") }}</span>
    <span class="toast__body"><strong data-toast-title></strong><span data-toast-text></span></span>
    <button class="icon-btn icon-btn--xs" type="button" data-toast-close aria-label="بستن">{{ icon("x") }}</button>
    <span class="toast__progress"></span>
  </div>
</template>
